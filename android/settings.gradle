pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// --- locate Flutter SDK ---
def flutterSdkPath = System.getenv("FLUTTER_ROOT")

if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    def localPropertiesFile = new File(rootDir, "local.properties")
    if (localPropertiesFile.exists()) {
        def properties = new Properties()
        localPropertiesFile.withInputStream { properties.load(it) }
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }
}

if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    throw new GradleException("Flutter SDK not found. Set FLUTTER_ROOT or define flutter.sdk in android/local.properties")
}

// Flutter Gradle tooling (NOT from Maven)
includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

rootProject.name = "android"
include(":app")
